name: CI / CD Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Automated Test Suite (427 Tests via Vitest)
        run: npm run test

      - name: Next.js Production Build Verification
        run: npm run build
        env:
          NODE_ENV: production
